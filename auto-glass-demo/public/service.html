<body>
  <div class="demo-bar">PORTFOLIO CONCEPT • FICTIONAL AUTO-GLASS BUSINESS</div>

    <a class="back" href="index.html">← Back to demo</a>
    <section class="service-hero"><span class="eyebrow dark" id="kicker">AUTO GLASS SERVICE</span><h1 id="title">Windshield Service</h1><p id="intro"></p><div class="actions"><a class="button large" href="index.html#quote">Request a Quote →</a><a class="button secondary large" href="tel:+13065550188">Call 306-555-0188</a></div></section>

  <script>
  const data={
    repair:{k:'WINDSHIELD REPAIR',t:'Rock-chip repair should feel simple.',i:'A focused service page can explain which damage may be repairable, encourage customers to act before a chip spreads, and move them directly into a useful quote request.',p:[['Photo-first screening','Let the customer send a damage photo before the shop follows up.'],['Clear expectations','Explain that size, depth, location and contamination affect repair suitability.'],['Fast conversion path','Keep quote and call actions visible instead of burying them in navigation.']],ct:'Turn small damage into a fast lead.',cx:'The final repair decision belongs to a technician, but the website can reduce uncertainty and collect the right information first.'},
    replacement:{k:'WINDSHIELD REPLACEMENT',t:'Replacement pages should build confidence.',i:'Customers want to know what affects the quote, whether their vehicle has cameras or sensors, and what happens after installation.',p:[['Vehicle-specific quoting','Year, make, model and glass location help identify the correct windshield.'],['Installation confidence','Use verified client language around glass options, urethane, primers, warranty and safe drive-away time.'],['ADAS awareness','Flag camera-equipped vehicles early so calibration is part of the conversation.']],ct:'Make the replacement process easy to understand.',cx:'A strong page answers the major questions before the customer calls and gives the shop better lead information.'},
    mobile:{k:'MOBILE AUTO GLASS',t:'Bring the service option to the customer.',i:'Mobile-service customers need quick confirmation that their location and job may be eligible, plus clear expectations around weather and workspace requirements.',p:[['Service area','Show the actual cities and radius the shop serves.'],['Home or workplace','Make mobile service a first-class option in the quote flow.'],['Eligibility guidance','Explain that weather, workspace and service type may affect mobile availability.']],ct:'Make mobile service visible from the first screen.',cx:'For shops that offer mobile work, convenience can be a major conversion advantage when the website makes it obvious.'},
    adas:{k:'ADAS CALIBRATION',t:'Explain camera calibration without the jargon.',i:'Modern windshields may interact with forward-facing cameras and driver-assistance systems. A dedicated page helps customers understand why calibration may be discussed after replacement.',p:[['Camera-equipped vehicles','Explain where the camera is typically located and why the windshield matters.'],['Vehicle-specific procedure','Avoid blanket claims; calibration requirements vary by vehicle and repair procedure.'],['Documentation','A real shop can explain its verified calibration process and records.']],ct:'Turn a technical topic into customer confidence.',cx:'The website should educate without pretending every vehicle follows the same calibration procedure.'},
    insurance:{k:'INSURANCE ASSISTANCE',t:'Help with claims without over-collecting data.',i:'The public website can explain the shop’s insurance process and ask whether a claim may be involved without requesting unnecessary sensitive policy information.',p:[['Simple first question','Ask whether insurance may be involved: yes, no or not sure.'],['Explain the process','Use the client’s verified claim and direct-billing workflow.'],['Protect customer data','Move sensitive details into the shop’s approved secure process when necessary.']],ct:'Make insurance guidance helpful, not invasive.',cx:'This demo deliberately keeps policy numbers and other sensitive information out of the public lead form.'}
  };
  const key=new URLSearchParams(location.search).get('type')||'repair',d=data[key]||data.repair;document.title=d.t+' | Prairie Auto Glass Demo';document.querySelector('#kicker').textContent=d.k;document.querySelector('#title').textContent=d.t;document.querySelector('#intro').textContent=d.i;document.querySelector('#ctaTitle').textContent=d.ct;document.querySelector('#ctaText').textContent=d.cx;document.querySelector('#points').innerHTML=d.p.map((x,i)=>`<article><span>0${i+1}</span><h3>${x[0]}</h3><p>${x[1]}</p></article>`).join('');
